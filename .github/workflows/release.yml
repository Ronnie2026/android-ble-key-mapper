name: Build and release Android APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tested version tag, e.g. v0.1'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android tools
        run: |
          sdkmanager 'platforms;android-30' 'build-tools;35.0.0'
          if ($LASTEXITCODE) { throw 'Android SDK installation failed' }
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [xml]$manifest = Get-Content android-app/AndroidManifest.xml -Raw
          $version = $manifest.manifest.GetAttribute('versionName', 'http://schemas.android.com/apk/res/android')
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+(\.\d+)?$' -or $env:RELEASE_TAG -ne "v$version") { throw 'Tag and application version must match' }
          git rev-parse --verify "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE) { throw 'Release tag must already exist' }
      - name: Restore existing signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (!$env:KEYSTORE_BASE64) { throw 'Add the ANDROID_KEYSTORE_BASE64 repository secret first' }
          New-Item -ItemType Directory -Force .keys | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $PWD '.keys/yijia.jks'), [Convert]::FromBase64String($env:KEYSTORE_BASE64))
      - name: Build and verify signed APK
        run: ./build-app.ps1
      - name: Generate checksum
        run: |
          $apk = Get-ChildItem dist/Android-BLE-Key-Mapper-*.apk
          if (@($apk).Count -ne 1) { throw 'Expected exactly one APK' }
          $hash = (Get-FileHash $apk.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($apk.Name)" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG dist/*.apk dist/SHA256SUMS.txt --verify-tag --title "Android BLE Key Mapper $env:RELEASE_TAG" --notes-file "docs/releases/$env:RELEASE_TAG.md"
          if ($LASTEXITCODE) { throw 'Release publication failed; existing releases are never overwritten automatically' }
      - name: Remove temporary signing key
        if: always()
        run: |
          if (Test-Path .keys/yijia.jks) { Remove-Item -LiteralPath .keys/yijia.jks }
